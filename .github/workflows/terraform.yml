name: Terraform
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "00-bootstrap", "platform/ingress"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate -no-color
      - name: Regression tests (mock AWS; no credentials)
        if: matrix.directory == '.'
        run: terraform test -no-color
